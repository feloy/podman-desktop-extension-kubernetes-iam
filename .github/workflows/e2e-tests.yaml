name: e2e-tests

on: [pull_request]

permissions:
  contents: read

jobs:
  # Dedicated step to build the IAM extension image and extract the dashboard extension
  build-container:
    name: Build Extension Images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build IAM Image, Pull Dashboard Image and Extract Files
        id: build-image
        run: |
          mkdir -p output/plugins

          # IAM extension (built from this repository)
          podman build -t local_iam_image -f Containerfile ./
          IAM_CONTAINER_ID=$(podman create localhost/local_iam_image --entrypoint "")
          podman export "$IAM_CONTAINER_ID" | tar -x -C output/plugins/
          mv output/plugins/extension output/plugins/kubernetes-iam
          podman rm -f "$IAM_CONTAINER_ID"
          podman rmi -f localhost/local_iam_image:latest

          # Dashboard extension (prebuilt image required by IAM)
          DASHBOARD_IMAGE=ghcr.io/podman-desktop/podman-desktop-extension-kubernetes-dashboard/pr:c353a4c5ae4e4a94f2a4197e4689eb7f3c0c6008
          podman pull "$DASHBOARD_IMAGE"
          DASHBOARD_CONTAINER_ID=$(podman create "$DASHBOARD_IMAGE" --entrypoint "")
          podman export "$DASHBOARD_CONTAINER_ID" | tar -x -C output/plugins/
          mv output/plugins/extension output/plugins/kubernetes-dashboard
          podman rm -f "$DASHBOARD_CONTAINER_ID"
          podman rmi -f "$DASHBOARD_IMAGE"
      - name: Upload Extension Image Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-plugin
          path: output/plugins/

  integration-tests-pr-check:
    name: integration tests / ${{ matrix.os }} / ${{ matrix.variant }}
    needs: build-container
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The subtitled run needs a fresh cluster: the tests deliberately create,
      # update, and remove RBAC resources. Keep it as a separate Linux matrix
      # job while sharing the extension-plugin artifact built above.
      matrix:
        include:
          - os: windows-2025
            variant: baseline
            test_command: test:e2e:integration
          - os: ubuntu-24.04
            variant: baseline
            test_command: test:e2e:integration
          - os: macos-26
            variant: baseline
            test_command: test:e2e:integration
          - os: ubuntu-24.04
            variant: subtitled
            test_command: test:e2e:integration:subtitled
    env:
      SKIP_INSTALLATION: true
      EXTENSION_PREINSTALLED: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Revert unprivileged user namespace restrictions in Ubuntu 24.04
        if: runner.os == 'Linux'
        run: |
          # allow unprivileged user namespace
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # ==============================================
      # Installing Podman Desktop
      # ==============================================
      - name: Install Podman Desktop
        uses: podman-desktop/gh-extensions-actions/.github/actions/podman-desktop-install@b4b8e5e23892be808f1c83da6d82d57db2e2935c # v0.8.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      # Install Node.js
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      # Install npm packages for extension
      - name: Execute pnpm in Extension
        run: pnpm install

      # Install the extensions (IAM + Dashboard)
      - name: Download Extension Plugins
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-plugin
          path: tests/playwright/tests/playwright/output/kubernetes-iam-tests/plugins/

      # Run envtest cluster
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: install envtest-start and setup-envtest binaries
        shell: bash
        run: |
          go install github.com/feloy/envtest-start@v0.3.0
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.24

      - name: install envtest with latest kubernetes version with setup-envtest
        id: setup-envtest
        shell: bash
        run: |
          KUBEBUILDER_ASSETS=$(setup-envtest use -p path)
          echo "KUBEBUILDER_ASSETS=$KUBEBUILDER_ASSETS" >> $GITHUB_OUTPUT

      - name: Run primary envtest cluster
        id: run-primary-envtest
        env:
          KUBEBUILDER_ASSETS: ${{ steps.setup-envtest.outputs.KUBEBUILDER_ASSETS }}
        shell: bash
        run: |
          KUBECONFIG='${{ runner.temp }}/envtest-kubeconfig'
          KUBECONFIG_USER1='${{ runner.temp }}/user1-kubeconfig'
          envtest-start --fake-kubelet --users 1 "$KUBECONFIG" &
          ENVTEST_START_PID=$!
          echo "ENVTEST_START_PID=$ENVTEST_START_PID" >> $GITHUB_OUTPUT
          echo "KUBECONFIG=$KUBECONFIG" >> $GITHUB_OUTPUT
          echo "KUBECONFIG_USER1=$KUBECONFIG_USER1" >> $GITHUB_OUTPUT

      - name: Run secondary envtest cluster
        id: run-secondary-envtest
        env:
          KUBEBUILDER_ASSETS: ${{ steps.setup-envtest.outputs.KUBEBUILDER_ASSETS }}
        shell: bash
        run: |
          KUBECONFIG_SECOND='${{ runner.temp }}/envtest-kubeconfig-secondary'
          envtest-start "$KUBECONFIG_SECOND" &
          ENVTEST_SECOND_START_PID=$!
          echo "ENVTEST_SECOND_START_PID=$ENVTEST_SECOND_START_PID" >> $GITHUB_OUTPUT
          echo "KUBECONFIG_SECOND=$KUBECONFIG_SECOND" >> $GITHUB_OUTPUT

      - name: check cluster is accessible, should show a service named "kubernetes"
        env:
          KUBEBUILDER_ASSETS: ${{ steps.setup-envtest.outputs.KUBEBUILDER_ASSETS }}
          KUBECONFIG: '${{ steps.run-primary-envtest.outputs.KUBECONFIG }}'
        shell: bash
        run: |
          "$KUBEBUILDER_ASSETS/kubectl" get all | grep "service/kubernetes"

      - name: check secondary cluster is accessible
        env:
          KUBEBUILDER_ASSETS: ${{ steps.setup-envtest.outputs.KUBEBUILDER_ASSETS }}
          KUBECONFIG: '${{ steps.run-secondary-envtest.outputs.KUBECONFIG_SECOND }}'
        shell: bash
        run: |
          "$KUBEBUILDER_ASSETS/kubectl" get all | grep "service/kubernetes"

      - name: Seed secondary cluster RBAC
        env:
          KUBEBUILDER_ASSETS: ${{ steps.setup-envtest.outputs.KUBEBUILDER_ASSETS }}
          KUBECONFIG: '${{ steps.run-secondary-envtest.outputs.KUBECONFIG_SECOND }}'
        shell: bash
        run: |
          "$KUBEBUILDER_ASSETS/kubectl" create clusterrolebinding secondary-user-cluster-admin --clusterrole=cluster-admin --user=secondary-user

      - name: Install test CRD
        env:
          KUBEBUILDER_ASSETS: ${{ steps.setup-envtest.outputs.KUBEBUILDER_ASSETS }}
          KUBECONFIG: '${{ steps.run-primary-envtest.outputs.KUBECONFIG }}'
        shell: bash
        run: |
          "$KUBEBUILDER_ASSETS/kubectl" apply -f tests/resources/e2e-test-crd.yaml
          "$KUBEBUILDER_ASSETS/kubectl" wait --for=condition=Established --timeout=30s crd/widgets.testing.kubernetes-iam.io

      - name: Install kubectl on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install kubectl
          kubectl version --client

      - name: Install ffmpeg for xvfb recording
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Merge envtest kubeconfig files
        shell: bash
        run: |
          PRIMARY_KUBECONFIG_JSON=$(mktemp)
          SECONDARY_KUBECONFIG_JSON=$(mktemp)
          MERGED_KUBECONFIG_JSON=$(mktemp)
          trap 'rm -f "$PRIMARY_KUBECONFIG_JSON" "$SECONDARY_KUBECONFIG_JSON" "$MERGED_KUBECONFIG_JSON"' EXIT
          "$KUBEBUILDER_ASSETS/kubectl" config view --raw --flatten --kubeconfig "${KUBECONFIG}" -o json > "$PRIMARY_KUBECONFIG_JSON"
          "$KUBEBUILDER_ASSETS/kubectl" config view --raw --flatten --kubeconfig "${KUBECONFIG_SECOND}" -o json |
            jq '
              .clusters |= map(.name = "envtest-secondary") |
              .users |= map(.name = "envtest-secondary") |
              .contexts |= map(.name = "envtest-secondary" | .context.cluster = "envtest-secondary" | .context.user = "envtest-secondary")
            ' > "$SECONDARY_KUBECONFIG_JSON"
          jq -s '
            .[0] + {
              clusters: (.[0].clusters + .[1].clusters),
              users: (.[0].users + .[1].users),
              contexts: (.[0].contexts + .[1].contexts),
              "current-context": .[0]["current-context"]
            }
          ' "$PRIMARY_KUBECONFIG_JSON" "$SECONDARY_KUBECONFIG_JSON" > "$MERGED_KUBECONFIG_JSON"
          "$KUBEBUILDER_ASSETS/kubectl" config view --raw --flatten --kubeconfig "$MERGED_KUBECONFIG_JSON" > ./tests/resources/envtest-kubeconfig
          "$KUBEBUILDER_ASSETS/kubectl" config current-context --kubeconfig ./tests/resources/envtest-kubeconfig | grep -x envtest
        env:
          KUBEBUILDER_ASSETS: ${{ steps.setup-envtest.outputs.KUBEBUILDER_ASSETS }}
          KUBECONFIG: ${{ steps.run-primary-envtest.outputs.KUBECONFIG }}
          KUBECONFIG_SECOND: ${{ steps.run-secondary-envtest.outputs.KUBECONFIG_SECOND }}

      # Run tests
      - name: Run Integration tests
        shell: bash
        run: |
          cp "${KUBECONFIG}" ./tests/resources/envtest-primary-kubeconfig
          cp "${KUBECONFIG_USER1}" ./tests/resources/envtest-kubeconfig-user1
          pnpm ${{ matrix.test_command }}
        env:
          NODE_OPTIONS: --no-experimental-strip-types
          KUBEBUILDER_ASSETS: ${{ steps.setup-envtest.outputs.KUBEBUILDER_ASSETS }}
          KUBECONFIG: ${{ steps.run-primary-envtest.outputs.KUBECONFIG }}
          KUBECONFIG_USER1: ${{ steps.run-primary-envtest.outputs.KUBECONFIG_USER1 }}
          DEBUGGING_PORT: 9222
          PODMAN_DESKTOP_BINARY: ${{ env.PODMAN_DESKTOP_BINARY }}

      - name: stop envtest cluster on non-macOS
        if: always() && runner.os != 'macOS'
        env:
          ENVTEST_START_PID: ${{ steps.run-primary-envtest.outputs.ENVTEST_START_PID }}
          ENVTEST_SECOND_START_PID: ${{ steps.run-secondary-envtest.outputs.ENVTEST_SECOND_START_PID }}
        shell: bash
        # These commands are working on both Linux and Windows, change carefully
        run: |
          kill ${ENVTEST_START_PID}
          kill ${ENVTEST_SECOND_START_PID}
          timeout 10s bash -c "while ps | grep envtest-start > /dev/null; do sleep 1; done"

      - name: stop envtest cluster on macOS
        if: always() && runner.os == 'macOS'
        env:
          ENVTEST_START_PID: ${{ steps.run-primary-envtest.outputs.ENVTEST_START_PID }}
          ENVTEST_SECOND_START_PID: ${{ steps.run-secondary-envtest.outputs.ENVTEST_SECOND_START_PID }}
        shell: bash
        run: |
          kill ${ENVTEST_START_PID}
          kill ${ENVTEST_SECOND_START_PID}
          brew install coreutils
          gtimeout 10s bash -c "while ps | grep envtest-start > /dev/null; do sleep 1; done"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-pr-check-${{ matrix.os }}-${{ matrix.variant }}
          path: |
            tests/playwright/output/
            tests/playwright/tests/
            tests/playwright/recordings/
